<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCam - Gestão Acadêmica</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./global.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <div>
          <h2>EduCam</h2>
          <span>GESTÃO ACADÊMICA</span>
        </div>
      </div>

      <nav class="nav-menu">
        <a href="#/painel" class="nav-item active" data-page="painel">
          <span class="icon">📊</span> Painel
        </a>
        <a href="#/turmas" class="nav-item" data-page="turmas">
          <span class="icon">🎓</span> Turmas
        </a>
        <a href="#/relatorios" class="nav-item" data-page="relatorios">
          <span class="icon">📄</span> Relatórios
        </a>
        <a href="#/configuracoes" class="nav-item" data-page="configuracoes">
          <span class="icon">⚙️</span> Configurações
        </a>
      </nav>
    </div>

    <div class="sidebar-user">
      <div class="avatar">AD</div>
      <div class="user-info">
        <strong>Admin</strong>
        <small>Secretaria Escolar</small>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="search-bar">
        <input type="text" placeholder="Buscar aluno ou turma...">
      </div>
    </header>

    <div id="page-content"></div>
  </main>

  <script src="./router.js"></script>
</body>
</html>
