<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCam - Gestão Acadêmica</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 (Icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="./global.css">
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <img src="./assets/logo.png" alt="Logo EduCam" class="brand-logo">
        <div>
          <h2>EduCam</h2>
          <span>GESTÃO ACADÊMICA</span>
        </div>
      </div>

      <nav class="nav-menu">
        <a href="#/painel" class="nav-item active" data-page="painel">
          <i class="fa-solid fa-chart-line nav-icon"></i>
          <span>Painel</span>
        </a>
        <a href="#/turmas" class="nav-item" data-page="turmas">
          <i class="fa-solid fa-graduation-cap nav-icon"></i>
          <span>Turmas</span>
        </a>
        <a href="#/relatorios" class="nav-item" data-page="relatorios">
          <i class="fa-regular fa-file-lines nav-icon"></i>
          <span>Relatórios</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-user">
      <div class="avatar">AD</div>
      <div class="user-info">
        <strong>Admin</strong>
        <small>Secretaria Escolar</small>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="search-bar">
      </div>
    </header>

    <div id="page-content"></div>
  </main>

  <script src="./router.js"></script>
</body>

</html>
